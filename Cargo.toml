[workspace]
resolver = "2"
members = ["crates/domain", "crates/policy", "crates/runner", "crates/server"]
exclude = ["crates/patch", "third_party"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/novelKR/CodeSpace"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.0"
rmcp = { version = "3.4.0", features = [
  "server",
  "macros",
  "schemars",
  "client",
  "transport-io",
  "transport-child-process",
  "transport-streamable-http-server",
  "transport-streamable-http-client-reqwest",
] }
