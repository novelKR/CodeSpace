[workspace]
resolver = "2"
members = ["crates/domain", "crates/policy", "crates/runner", "crates/store", "crates/server"]
exclude = ["crates/patch", "crates/codex-runtime", "crates/pty", "crates/file-system", "crates/linux-sandbox", "third_party"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/novelKR/CodeSpace"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.0"
rmcp = { version = "3.4.0", features = [
  "server",
  "macros",
  "schemars",
  "client",
  "transport-io",
  "transport-child-process",
  "transport-streamable-http-server",
  "transport-streamable-http-client-reqwest",
] }

# Same Codex git forks as `crates/file-system` so path-dep LOCAL_FS matches
# the isolated adapter workspace.
[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
