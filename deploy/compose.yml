# Isolation fixture only. Not connected to exec_command.
# Demonstrates unprivileged uid, workspace-only bind mount, and dropped caps.
# Forbidden mounts: host home, SSH sockets, Docker engine socket, gateway env files, SQLite.
# There is no runner control socket today; do not add one here later by accident.

services:
  isolation-fixture:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - type: bind
        source: ${CODESPACE_WORKSPACE:?set CODESPACE_WORKSPACE to the project dir}
        target: /workspace
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
