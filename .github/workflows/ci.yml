name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Incremental data is useless in CI, and debuginfo roughly doubles the
  # target size that the per-job dependency caches have to hold.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  policy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Core Codex / model dep scan
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/validate-upstream.py policy python --output target/upstream-reports/policy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-${{ github.job }}-${{ matrix.name || 'single' }}-${{ github.run_attempt }}
          path: target/upstream-reports/
          if-no-files-found: warn

  rust-format:
    name: Rust / Format + upstream pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and pin
        run: python3 scripts/validate-upstream.py pin format --output target/upstream-reports/format
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-${{ github.job }}-${{ matrix.name || 'single' }}-${{ github.run_attempt }}
          path: target/upstream-reports/
          if-no-files-found: warn

  rust-clippy:
    name: Rust / Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # rust-cache prunes the shared target dir once per listed workspace and
        # keeps only that workspace's dependencies, so every leg names a single
        # anchor workspace whose dependencies cover what the leg compiles.
        include:
          - name: root
            stage: clippy-root dependencies
            cache-workspace: ". -> target/upstream-validation"
          - name: adapters
            stage: clippy-adapters
            cache-workspace: "crates/patch -> ../../target/upstream-validation"
          - name: codex-adapters
            stage: clippy-codex
            cache-workspace: "crates/codex-runtime -> ../../target/upstream-validation"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.name }}
          workspaces: ${{ matrix.cache-workspace }}
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: python3 scripts/validate-upstream.py ${{ matrix.stage }} --output target/upstream-reports/${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-${{ github.job }}-${{ matrix.name || 'single' }}-${{ github.run_attempt }}
          path: target/upstream-reports/
          if-no-files-found: warn

  rust-unit:
    name: Rust / Unit (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: patch
            stage: unit-patch
            cache-workspace: "crates/patch -> ../../target/upstream-validation"
          - name: codex-runtime
            stage: unit-codex-runtime
            cache-workspace: "crates/codex-runtime -> ../../target/upstream-validation"
          - name: pty
            stage: unit-pty
            cache-workspace: "crates/pty -> ../../target/upstream-validation"
          - name: file-system
            stage: unit-file-system
            cache-workspace: "crates/file-system -> ../../target/upstream-validation"
          - name: linux-sandbox-protocol
            stage: unit-linux-sandbox-protocol
            cache-workspace: ". -> target/upstream-validation"
          - name: linux-sandbox
            stage: unit-linux-sandbox
            cache-workspace: "crates/linux-sandbox -> ../../target/upstream-validation"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.name }}
          workspaces: ${{ matrix.cache-workspace }}
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Unit tests
        run: python3 scripts/validate-upstream.py ${{ matrix.stage }} --output target/upstream-reports/unit-${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-${{ github.job }}-${{ matrix.name || 'single' }}-${{ github.run_attempt }}
          path: target/upstream-reports/
          if-no-files-found: warn

  rust-linux-isolation:
    name: Rust / Linux isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "crates/linux-sandbox -> ../../target/upstream-validation"
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Enable unprivileged user namespaces for bubblewrap
        run: |
          set -euo pipefail

          # GitHub-hosted Ubuntu may disable unprivileged user namespaces, or
          # gate them through AppArmor. Either condition can make bwrap fail
          # while bringing up the isolated loopback device for --unshare-net.
          current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            echo "Enabling kernel.unprivileged_userns_clone for bubblewrap."
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

          current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [ -n "$current_apparmor" ] && [ "$current_apparmor" != "0" ]; then
            echo "Disabling kernel.apparmor_restrict_unprivileged_userns for bubblewrap."
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Linux isolation tests
        run: python3 scripts/validate-upstream.py linux-isolation --output target/upstream-reports/isolation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-${{ github.job }}-${{ matrix.name || 'single' }}-${{ github.run_attempt }}
          path: target/upstream-reports/
          if-no-files-found: warn

  rust-integration:
    name: Rust / Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target/upstream-validation"
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Enable unprivileged user namespaces for bubblewrap
        run: |
          set -euo pipefail

          current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

          current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [ -n "$current_apparmor" ] && [ "$current_apparmor" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Workspace integration tests
        run: python3 scripts/validate-upstream.py integration --output target/upstream-reports/integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-${{ github.job }}-${{ matrix.name || 'single' }}-${{ github.run_attempt }}
          path: target/upstream-reports/
          if-no-files-found: warn

  rust-macos:
    name: Rust / macOS contracts
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "crates/file-system -> ../../target/upstream-validation"
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: macOS contracts and dependencies
        run: python3 scripts/validate-upstream.py macos-core dependencies --output target/upstream-reports/macos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-${{ github.job }}-${{ matrix.name || 'single' }}-${{ github.run_attempt }}
          path: target/upstream-reports/
          if-no-files-found: warn

  rust:
    name: rust
    if: ${{ always() }}
    needs:
      - rust-format
      - rust-clippy
      - rust-unit
      - rust-linux-isolation
      - rust-integration
      - rust-macos
      - policy-scan
    runs-on: ubuntu-latest
    steps:
      - name: Require all Rust checks
        run: |
          test "${{ needs.rust-format.result }}" = "success"
          test "${{ needs.rust-clippy.result }}" = "success"
          test "${{ needs.rust-unit.result }}" = "success"
          test "${{ needs.rust-linux-isolation.result }}" = "success"
          test "${{ needs.rust-integration.result }}" = "success"
          test "${{ needs.rust-macos.result }}" = "success"
          test "${{ needs.policy-scan.result }}" = "success"
