name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '43 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request replaces its running checks; every main
  # push, scheduled and manual run completes on its own.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Incremental data is useless in CI, and debuginfo roughly doubles the
  # target size that the per-job dependency caches have to hold.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  plan:
    name: CI / Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      rust-clippy: ${{ steps.plan.outputs.rust-clippy }}
      rust-clippy-matrix: ${{ steps.plan.outputs.rust-clippy-matrix }}
      rust-unit: ${{ steps.plan.outputs.rust-unit }}
      rust-unit-matrix: ${{ steps.plan.outputs.rust-unit-matrix }}
      rust-linux-isolation: ${{ steps.plan.outputs.rust-linux-isolation }}
      rust-integration: ${{ steps.plan.outputs.rust-integration }}
      rust-macos: ${{ steps.plan.outputs.rust-macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Verify CI policy
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_ci_*.py'
      - id: plan
        name: Plan affected checks
        run: python3 -B scripts/ci_plan.py
      - uses: actions/upload-artifact@v4
        with:
          name: ci-plan-${{ github.run_attempt }}
          path: target/ci-plan/plan.json
          if-no-files-found: error

  policy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - name: Core Codex / model dep scan
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/validate-upstream.py policy python --output target/upstream-reports/policy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-${{ github.job }}-${{ matrix.name || 'single' }}-${{ github.run_attempt }}
          path: target/upstream-reports/
          if-no-files-found: warn

  rust-format:
    name: Rust / Format + upstream pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format and pin
        run: python3 scripts/validate-upstream.py pin format --output target/upstream-reports/format
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-${{ github.job }}-${{ matrix.name || 'single' }}-${{ github.run_attempt }}
          path: target/upstream-reports/
          if-no-files-found: warn

  rust-clippy:
    name: Rust / Clippy (${{ matrix.name }})
    needs: plan
    if: ${{ needs.plan.outputs.rust-clippy == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Legs, stages and cache anchors come from scripts/ci-policy.json.
      # rust-cache prunes the shared target dir once per listed workspace and
      # keeps only that workspace's dependencies, so every leg names a single
      # anchor workspace whose dependencies cover what the leg compiles.
      matrix: ${{ fromJSON(needs.plan.outputs.rust-clippy-matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.name }}
          workspaces: ${{ matrix.cache-workspace }}
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: python3 scripts/validate-upstream.py ${{ matrix.stage }} --output target/upstream-reports/${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-${{ github.job }}-${{ matrix.name || 'single' }}-${{ github.run_attempt }}
          path: target/upstream-reports/
          if-no-files-found: warn

  rust-unit:
    name: Rust / Unit (${{ matrix.name }})
    needs: plan
    if: ${{ needs.plan.outputs.rust-unit == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.rust-unit-matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.name }}
          workspaces: ${{ matrix.cache-workspace }}
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Unit tests
        run: python3 scripts/validate-upstream.py ${{ matrix.stage }} --output target/upstream-reports/unit-${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-${{ github.job }}-${{ matrix.name || 'single' }}-${{ github.run_attempt }}
          path: target/upstream-reports/
          if-no-files-found: warn

  rust-linux-isolation:
    name: Rust / Linux isolation
    needs: plan
    if: ${{ needs.plan.outputs.rust-linux-isolation == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "crates/linux-sandbox -> ../../target/upstream-validation"
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Enable unprivileged user namespaces for bubblewrap
        run: |
          set -euo pipefail

          # GitHub-hosted Ubuntu may disable unprivileged user namespaces, or
          # gate them through AppArmor. Either condition can make bwrap fail
          # while bringing up the isolated loopback device for --unshare-net.
          current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            echo "Enabling kernel.unprivileged_userns_clone for bubblewrap."
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

          current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [ -n "$current_apparmor" ] && [ "$current_apparmor" != "0" ]; then
            echo "Disabling kernel.apparmor_restrict_unprivileged_userns for bubblewrap."
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Linux isolation tests
        run: python3 scripts/validate-upstream.py linux-isolation --output target/upstream-reports/isolation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-${{ github.job }}-${{ matrix.name || 'single' }}-${{ github.run_attempt }}
          path: target/upstream-reports/
          if-no-files-found: warn

  rust-integration:
    name: Rust / Integration
    needs: plan
    if: ${{ needs.plan.outputs.rust-integration == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target/upstream-validation"
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Enable unprivileged user namespaces for bubblewrap
        run: |
          set -euo pipefail

          current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          if [ -n "$current_userns" ] && [ "$current_userns" != "1" ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi

          current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [ -n "$current_apparmor" ] && [ "$current_apparmor" != "0" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Workspace integration tests
        run: python3 scripts/validate-upstream.py integration --output target/upstream-reports/integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-${{ github.job }}-${{ matrix.name || 'single' }}-${{ github.run_attempt }}
          path: target/upstream-reports/
          if-no-files-found: warn

  rust-macos:
    name: Rust / macOS contracts
    needs: plan
    if: ${{ needs.plan.outputs.rust-macos == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "crates/file-system -> ../../target/upstream-validation"
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: macOS contracts and dependencies
        run: python3 scripts/validate-upstream.py macos-core dependencies --output target/upstream-reports/macos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-${{ github.job }}-${{ matrix.name || 'single' }}-${{ github.run_attempt }}
          path: target/upstream-reports/
          if-no-files-found: warn

  rust:
    name: rust
    # Never skippable: it proves the planned legs passed and the rest were skipped.
    if: ${{ always() }}
    needs:
      - plan
      - policy-scan
      - rust-format
      - rust-clippy
      - rust-unit
      - rust-linux-isolation
      - rust-integration
      - rust-macos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/download-artifact@v4
        # A missing report fails the check below, not this download.
        continue-on-error: true
        with:
          pattern: upstream-*
          path: target/ci-reports
      - name: Require the planned checks
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
          CI_PLAN: ${{ needs.plan.outputs.plan }}
        run: python3 -B scripts/check_ci_results.py --reports target/ci-reports
