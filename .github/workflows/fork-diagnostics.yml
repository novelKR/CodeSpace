name: Fork diagnostics (temporary)

# Temporary investigation of children killed inside fork on macOS. Runs only on this branch and
# is removed before the pull request is opened; its runs keep the evidence.

on:
  push:
    branches: [claude/magical-euler-nvqrxp]
  workflow_dispatch:
    inputs:
      trials:
        description: Stress trials
        default: "400"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Target directory
        run: echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target/diag" >> "$GITHUB_ENV"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fork-diagnostics
          workspaces: |
            . -> target/diag
            crates/codex-runtime -> ../../target/diag
            crates/patch -> ../../target/diag
          cache-bin: "false"
      - name: Host
        run: |
          sw_vers
          uname -a
          sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string
          xcrun lldb --version
          rustc -vV
          ulimit -n
          DevToolsSecurity -status || true
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | wc -l
      - name: Build
        run: |
          cargo build --locked -p codespace-server --bin codespace-mcp
          cargo build --locked --manifest-path crates/codex-runtime/Cargo.toml --bin codespace-codex-runtime
          cargo build --locked --manifest-path crates/patch/Cargo.toml --bin codespace-patch
          cargo test --locked -p codespace-runner --test fork_race --no-run
      - name: Probes and stress
        timeout-minutes: 60
        env:
          TRIALS: ${{ github.event.inputs.trials || '400' }}
        run: bash .github/fork-diagnostics/run.sh
      - name: Process-lifecycle suites
        if: always()
        timeout-minutes: 60
        run: |
          export CODESPACE_PATCH_BIN="$CARGO_TARGET_DIR/debug/codespace-patch"
          export CODESPACE_RUNTIME_BIN="$CARGO_TARGET_DIR/debug/codespace-codex-runtime"
          mkdir -p diag-out
          status=0
          for suite in "-p codespace-runner" "-p codespace-server" "--manifest-path crates/codex-runtime/Cargo.toml"; do
            name="$(echo "$suite" | tr -c 'a-z0-9\n' '-' | tr -s '-')"
            echo "== cargo test $suite"
            cargo test --locked $suite > "diag-out/suite$name.log" 2>&1 || status=1
            grep -E "^test result|FAILED|panicked" "diag-out/suite$name.log" || true
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fork-diagnostics-${{ github.run_attempt }}
          path: diag-out/
          if-no-files-found: warn
