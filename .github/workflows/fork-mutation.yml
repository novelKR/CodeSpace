name: Fork mitigation removal checks (temporary)

# Temporary: removing each part of the libnotify mitigation must fail the macOS tests that guard
# it. Runs only on this branch and is removed before the pull request is opened; its runs keep
# the evidence.

on:
  push:
    branches: [claude/magical-euler-nvqrxp]
    paths: [.github/workflows/fork-mutation.yml, .github/fork-diagnostics/mutation.sh]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Target directory
        run: echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/target/diag" >> "$GITHUB_ENV"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fork-diagnostics
          workspaces: |
            . -> target/diag
          cache-bin: "false"
          save-if: "false"
      - name: Host
        run: |
          sw_vers
          rustc -vV
          git rev-parse HEAD
      - name: Removal checks
        timeout-minutes: 100
        run: bash .github/fork-diagnostics/mutation.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fork-mutation-${{ github.run_attempt }}
          path: diag-out/
          if-no-files-found: warn
