name: Main gateway check (temporary)

# Temporary: repeats on macOS the gateway DevGuard test command that failed in main's post-merge
# CI run 37114872355 and prints every failure to the job log.

on:
  push:
    branches: [claude/magical-euler-nvqrxp]
    paths: [.github/workflows/main-gateway-check.yml, .github/main-gateway-check/run.sh]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  macos:
    name: macOS ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Run 37116156097 tested main after #86 (02cf905) and before it (3206865).
          - name: with the test fixes 1
            ref: ${{ github.sha }}
          - name: with the test fixes 2
            ref: ${{ github.sha }}
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: diag
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: src
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Host
        run: |
          sw_vers
          sysctl -n hw.ncpu
          rustc -vV
          git -C src rev-parse HEAD
      - name: Repeated runs
        timeout-minutes: 110
        run: bash diag/.github/main-gateway-check/run.sh "$PWD/src" 60
