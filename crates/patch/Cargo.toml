# Isolated workspace (excluded from the repo root workspace) so the pinned
# Codex crates keep their own workspace.dependencies.

[package]
name = "codespace-patch"
version = "0.5.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"
publish = false
description = "In-process Codex apply-patch adapter"

[workspace]
members = ["."]
resolver = "2"

[dependencies]
codespace-domain = { path = "../domain" }
codespace-policy = { path = "../policy" }
codex-apply-patch = { path = "../../third_party/codex/codex-rs/apply-patch" }
codex-exec-server = { path = "../../third_party/codex/codex-rs/exec-server" }
codex-utils-path-uri = { path = "../../third_party/codex/codex-rs/utils/path-uri" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "codespace-patch"
path = "src/bin/codespace-patch.rs"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "45fecb9508105988f42fe6ff0441783ed3717f92" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
