[package]
name = "codespace-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CodeSpace MCP gateway (rmcp stdio + Streamable HTTP)"
publish = false

[[bin]]
name = "codespace-mcp"
path = "src/main.rs"

[[test]]
name = "security"
path = "../../tests/security/adversarial.rs"

[[test]]
name = "recovery"
path = "../../tests/recovery/restart.rs"

[[test]]
name = "e2e"
path = "../../tests/e2e/flow.rs"

[dependencies]
codespace-domain = { path = "../domain" }
codespace-policy = { path = "../policy" }
codespace-runner = { path = "../runner" }
codespace-store = { path = "../store" }
rmcp = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "io-std", "io-util", "net", "time", "process", "sync"] }
tokio-util = "0.7"
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
axum = { version = "0.8", features = ["macros"] }
http = "1"
schemars = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
tower = "0.5"
subtle = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rmcp = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }
tempfile = "3"
codespace-store = { path = "../store" }
