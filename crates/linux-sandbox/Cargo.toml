# Isolated workspace (excluded from the repo root workspace) so the pinned
# Codex crates keep their own workspace.dependencies. Binary-only: no
# [lib], so the runner cannot take this crate as a path library dep.

[package]
name = "codespace-linux-sandbox"
version = "0.6.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"
publish = false
description = "Isolated Linux sandbox helper binary: prepare/run Codex argv without a library API"

[workspace]
members = ["."]
resolver = "2"

[dependencies]
codespace-linux-sandbox-protocol = { path = "../linux-sandbox-protocol" }
codex-linux-sandbox = { path = "../../third_party/codex/codex-rs/linux-sandbox" }
codex-network-proxy = { path = "../../third_party/codex/codex-rs/network-proxy" }
codex-protocol = { path = "../../third_party/codex/codex-rs/protocol" }
codex-sandboxing = { path = "../../third_party/codex/codex-rs/sandboxing" }
codex-utils-path-uri = { path = "../../third_party/codex/codex-rs/utils/path-uri" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
# Resolver guards. Codex pin 6b9826e is validated against the Rama
# 0.3.0-alpha.4 train. Leaf crates use ^0.3.0-alpha.4, so a fresh
# resolve can pick stable 0.3.0 and break OpaqueError. These keys are
# not used in CodeSpace code; they pin the release train for this
# isolated helper lock. The runner does not path-depend this crate.
rama-error = "=0.3.0-alpha.4"
rama-macros = "=0.3.0-alpha.4"
rama-utils = "=0.3.0-alpha.4"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[[bin]]
name = "codespace-linux-sandbox"
path = "src/main.rs"

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
