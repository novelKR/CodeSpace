# Isolated workspace (excluded from the repo root workspace) so the pinned
# Codex crates keep their own workspace.dependencies.

[package]
name = "codespace-linux-sandbox"
version = "0.6.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"
publish = false
description = "Isolated Codex Linux sandbox adapter: helper argv without leaking Codex types"

[workspace]
members = ["."]
resolver = "2"

[dependencies]
codex-linux-sandbox = { path = "../../third_party/codex/codex-rs/linux-sandbox" }
codex-protocol = { path = "../../third_party/codex/codex-rs/protocol" }
codex-sandboxing = { path = "../../third_party/codex/codex-rs/sandboxing" }
codex-utils-path-uri = { path = "../../third_party/codex/codex-rs/utils/path-uri" }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[[bin]]
name = "codespace-linux-sandbox"
path = "src/bin/codespace-linux-sandbox.rs"

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
