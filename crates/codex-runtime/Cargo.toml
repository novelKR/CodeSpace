# Isolated workspace (excluded from the repo root workspace) so the pinned
# Codex crates keep their own workspace.dependencies.

[package]
name = "codespace-codex-runtime"
version = "0.6.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"
publish = false
description = "Isolated Codex execution adapter: process-hardening and Unix socket worker"

[workspace]
members = ["."]
resolver = "2"

[dependencies]
codespace-runner = { path = "../runner" }
codex-process-hardening = { path = "../../third_party/codex/codex-rs/process-hardening" }
codex-uds = { path = "../../third_party/codex/codex-rs/uds" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "fs", "sync", "process", "time"] }

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[dev-dependencies]
codespace-domain = { path = "../domain" }
codespace-policy = { path = "../policy" }
codespace-runner = { path = "../runner" }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "process"] }

[[bin]]
name = "codespace-codex-runtime"
path = "src/bin/codespace-codex-runtime.rs"
