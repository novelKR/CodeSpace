[package]
name = "codespace-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Path sandbox, in-process host process supervisor, isolation fixture checks"

[dependencies]
codespace-domain = { path = "../domain" }
codespace-policy = { path = "../policy" }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util"] }

[dev-dependencies]
tempfile = "3"
