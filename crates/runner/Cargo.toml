[package]
name = "codespace-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Runner trait, execution DTOs, InProcessRunner, and opt-in UdsRunner"

[dependencies]
codespace-domain = { path = "../domain" }
codespace-policy = { path = "../policy" }
codespace-pty = { path = "../pty" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util", "net", "sync"] }

[dev-dependencies]
tempfile = "3"
